[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rainen423-promptsens"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对提示微调的敏感性相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rainen423" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rainen423.github.io"
Repository = "https://github.com/rainen423/promptsens"
Issues = "https://github.com/rainen423/promptsens/issues"

[project.scripts]
promptsens = "promptsens:main"

[tool.setuptools]
py-modules = ["promptsens"]
